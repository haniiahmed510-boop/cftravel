*{margin:0;padding:0;box-sizing:border-box;}
:root{--primary:#0A2540;--secondary:#00B4D8;--accent:#FFB703;--text:#F8F9FA;--muted:#9CA3AF;}
html{scroll-behavior:smooth;}
body{font-family:'Cairo',sans-serif;color:var(--text);background:var(--primary);line-height:1.6;direction:rtl;overflow-x:hidden;}
a{text-decoration:none;color:inherit;}
ul{list-style:none;}
.container{max-width:1400px;margin:0 auto;padding:0 20px;}

.top-bar{background:linear-gradient(90deg,var(--primary),var(--secondary));color:#fff;text-align:center;padding:10px 20px;font-size:14px;font-weight:600;position:fixed;top:0;width:100%;z-index:1000;}
.navbar{background:rgba(10, 37, 64, 0.9);backdrop-filter:blur(15px);border-bottom:1px solid rgba(255,255,255,0.1);position:fixed;top:41px;width:100%;z-index:1000;}
.nav-inner{display:flex;align-items:center;justify-content:space-between;padding:15px 0;}
.logo{font-size:26px;font-weight:800;color:#fff;display:flex;align-items:center;gap:10px;}
.nav-logo-img{height:50px;width:auto;border-radius:8px;object-fit:contain;}
.nav-logo-text{display:flex;align-items:center;gap:5px;letter-spacing:0.5px;}
.nav-logo-text span{color:var(--accent);}
.nav-links{display:flex;gap:24px;align-items:center;}
.nav-links a{font-weight:600;color:#fff;transition:.3s;position:relative;font-size:16px;}
.nav-links a:hover,.nav-links a.active{color:var(--secondary);}
.nav-links a.active::after{content:'';position:absolute;bottom:-6px;right:0;left:0;height:3px;background:var(--accent);border-radius:2px;}
.menu-toggle{display:none;font-size:22px;background:none;border:none;color:#fff;cursor:pointer;}

.cars-hero { padding: 160px 20px 60px; text-align: center; background: linear-gradient(rgba(10, 37, 64, 0.8), rgba(10, 37, 64, 0.95)), url('https://images.unsplash.com/photo-1449965408869-eaa3f722e40d?w=1600') center/cover fixed; }
.cars-hero h1 { font-size: clamp(32px,5vw,56px); font-weight: 800; color: #fff; margin-bottom: 15px; }
.cars-hero h1 span { color: var(--secondary); text-shadow: 0 0 20px rgba(0, 180, 216, 0.5); }
.cars-hero p { font-size: clamp(16px,2vw,20px); color: #ddd; max-width: 800px; margin: 0 auto 20px; }
.hero-badges { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }
.hero-badges span { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); padding: 8px 20px; border-radius: 50px; font-size: 14px; color: var(--accent); font-weight: 700; display: flex; align-items: center; gap: 8px; }

.split-section { position: relative; width: 100%; height: 80vh; display: flex; background: var(--primary); overflow: hidden; }
.split-right { width: 65%; height: 100%; position: relative; overflow: hidden; }
.split-image { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0; transition: opacity 0.8s ease, transform 0.8s ease; transform: scale(1.05); }
.split-image.active { opacity: 1; transform: scale(1); }
.split-image::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to left, rgba(10,37,64,0.95) 0%, transparent 100%); }

.split-left { width: 35%; height: 100%; display: flex; flex-direction: column; justify-content: center; padding: 0 40px; background: rgba(10,37,64, 0.98); position: relative; z-index: 10; border-left: 1px solid rgba(255,255,255,0.05); }
.split-title { font-size: 28px; font-weight: 800; color: #fff; margin-bottom: 30px; line-height: 1.2; }
.split-title span { color: var(--secondary); }

.car-list { display: flex; flex-direction: column; gap: 10px; max-height: 55vh; overflow-y: auto; padding-left: 10px; }
.car-list::-webkit-scrollbar { width: 4px; }
.car-list::-webkit-scrollbar-thumb { background: var(--secondary); border-radius: 10px; }
.car-item { font-size: 18px; font-weight: 700; color: #555; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; gap: 12px; padding: 8px 0; }
.car-item i { font-size: 14px; color: transparent; transition: 0.3s; }
.car-item:hover, .car-item.active { color: var(--secondary); transform: translateX(-8px); }
.car-item:hover i, .car-item.active i { color: var(--secondary); transform: rotate(45deg); }
