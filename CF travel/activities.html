<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>الفعاليات | CF Travel</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--primary:#0A2540;--secondary:#00B4D8;--accent:#FFB703;--text:#F8F9FA;--muted:#9CA3AF;}
html{scroll-behavior:smooth;}

/* ✅ رجعنا خلفية موسكو للصفحة كلها */
body{
  font-family:'Cairo',sans-serif;
  color:var(--text);
  line-height:1.6;
  direction:rtl;
  overflow-x:hidden;
  background: linear-gradient(rgba(10, 37, 64, 0.85), rgba(10, 37, 64, 0.95)), url('https://images.unsplash.com/photo-1513326738677-b964603b136d?w=1600') center/cover fixed;
  background-attachment: fixed;
  background-size: cover;
}

a{text-decoration:none;color:inherit;}
ul{list-style:none;}
.container{max-width:1300px;margin:0 auto;padding:0 20px;}

/* Top Bar & Navbar */
.top-bar{background:linear-gradient(90deg,var(--primary),var(--secondary));color:#fff;text-align:center;padding:10px 20px;font-size:14px;font-weight:600;position:fixed;top:0;width:100%;z-index:1000;}
.navbar{background:rgba(10, 37, 64, 0.9);backdrop-filter:blur(15px);border-bottom:1px solid rgba(255,255,255,0.1);position:fixed;top:41px;width:100%;z-index:1000;}
.nav-inner{display:flex;align-items:center;justify-content:space-between;padding:15px 0;}
.logo{font-size:26px;font-weight:800;color:#fff;display:flex;align-items:center;gap:10px;}
.nav-logo-img{height:50px;width:auto;border-radius:8px;object-fit:contain;}
.nav-logo-text{display:flex;align-items:center;gap:5px;letter-spacing:0.5px;}
.nav-logo-text span{color:var(--accent);}
.nav-links{display:flex;gap:24px;align-items:center;}
.nav-links a{font-weight:600;color:#fff;transition:.3s;position:relative;font-size:16px;}
.nav-links a:hover,.nav-links a.active{color:var(--secondary);}
.nav-links a.active::after{content:'';position:absolute;bottom:-6px;right:0;left:0;height:3px;background:var(--accent);border-radius:2px;}
.menu-toggle{display:none;font-size:22px;background:none;border:none;color:#fff;cursor:pointer;}

/* ========================================================= */
/* ============ THE 3D WHEEL =============================== */
/* ========================================================= */
.showroom-section {
  position: relative; width: 100%; min-height: 100vh;
  display: flex; flex-direction: column; justify-content: center; align-items: center;
  padding-top: 100px; padding-bottom: 50px;
  overflow: hidden;
  /* الخلفية بقت على الـ body */
}

.city-title {
  font-size: 32px; font-weight: 800; color: var(--accent);
  margin: 40px 0 20px; text-align: center;
  display: flex; align-items: center; justify-content: center; gap: 15px;
  text-shadow: 0 0 20px rgba(255, 183, 3, 0.5);
}
.city-title span { height: 2px; width: 80px; background: linear-gradient(90deg, transparent, var(--accent), transparent); }

/* مسرح العرض */
.carousel-container {
  position: relative; width: 100%; height: 500px;
  display: flex; justify-content: center; align-items: center;
  perspective: 1200px; 
}

.carousel-track {
  position: relative; width: 320px; height: 450px;
  transform-style: preserve-3d;
  transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
}

/* الكارت */
.show-card {
  position: absolute; top: 0; left: 0;
  width: 320px; height: 450px;
  border-radius: 20px; overflow: hidden;
  background: #000;
  border: 2px solid rgba(255,255,255,0.1);
  box-shadow: 0 15px 35px rgba(0,0,0,0.5);
  transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
  transform-origin: center center; cursor: pointer;
}

.show-card img {
  width: 100%; height: 100%; object-fit: cover;
  transition: transform 0.6s;
}

/* تظليل الصورة */
.show-card::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(10,37,64,0.98) 0%, rgba(10,37,64,0.4) 60%, transparent 100%);
  transition: background 0.4s;
}

/* المحتوى */
.card-info {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 25px 20px; z-index: 2; text-align: center;
  transform: translateY(20px); opacity: 0; transition: all 0.5s;
}
.card-info h3 { font-size: 22px; font-weight: 800; color: var(--accent); margin-bottom: 8px; text-shadow: 0 2px 10px rgba(0,0,0,0.8);}
.card-info p { font-size: 14px; color: #ddd; line-height: 1.6; margin-bottom: 15px;}

.btn-book-small {
  background: var(--secondary); color: #000;
  border: none; padding: 10px 20px; border-radius: 50px;
  font-size: 14px; font-weight: 800; font-family: inherit;
  cursor: pointer; transition: 0.3s;
  display: inline-flex; align-items: center; gap: 6px;
}
.btn-book-small:hover { background: #fff; }

/* الكارت النشط */
.show-card.active {
  border-color: var(--secondary);
  box-shadow: 0 0 50px rgba(0, 180, 216, 0.5);
  z-index: 50;
}
.show-card.active img { transform: scale(1.05); }
.show-card.active .card-info { transform: translateY(0); opacity: 1; }

/* أزرار التنقل */
.nav-btn {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 60px; height: 60px; background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.2); color: #fff; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; font-size: 24px;
  cursor: pointer; z-index: 100; transition: 0.3s;
}
.nav-btn:hover { background: var(--secondary); color: #000; transform: translateY(-50%) scale(1.1); }
.nav-prev { right: 10%; }
.nav-next { left: 10%; }

/* Footer */
.footer{position:relative; width:100%; background:rgba(5,12,21,0.95); border-top:1px solid rgba(255, 255, 255, 0.1); color:#fff;padding:20px 0;text-align:center; display:flex; justify-content:center; align-items:center; gap:20px;}
.footer p{opacity:.8;font-size:13px; margin:0;}

/* Floating Social */
.floating-social { position: fixed; bottom: 30px; left: 30px; display: flex; flex-direction: column; gap: 15px; z-index: 999; }
.social-btn { width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 26px; color: #fff; transition: all 0.3s ease; box-shadow: 0 5px 15px rgba(0,0,0,0.4); }
.social-btn:hover { transform: scale(1.1) translateY(-3px); }
.btn-wa { background: #25D366; box-shadow: 0 5px 20px rgba(37,211,102,0.4); animation: pulse 2s infinite; }
.btn-tiktok { background: #000; border: 2px solid #fff; color: #fff;}
.btn-email { background: var(--accent); color: #000; }
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(37,211,102,.6);}70%{box-shadow:0 0 0 20px rgba(37,211,102,0);}100%{box-shadow:0 0 0 0 rgba(37,211,102,0);}}

@media(max-width:900px){
  .carousel-track { width: 280px; height: 400px; }
  .show-card { width: 280px; height: 400px; }
  .nav-btn { width: 45px; height: 45px; font-size: 18px; }
  .nav-prev { right: 2%; }
  .nav-next { left: 2%; }
  .footer { flex-direction: column; gap: 5px; }
}
</style>
</head>
<body>

<div class="top-bar">
  <i class="fa-solid fa-circle-check"></i> أسعارنا أقل من السعر الرسمي للفندق — حجوزات فورية
</div>

<nav class="navbar">
  <div class="container nav-inner">
    <a href="index.html" class="logo">
      <img src="images/logo.png" alt="CF Travel Logo" class="nav-logo-img" onerror="this.style.display='none'">
      <div class="nav-logo-text"><span>Travel</span> CF</div>
    </a>
    <button class="menu-toggle"><i class="fa-solid fa-bars"></i></button>
    <ul class="nav-links">
      <li><a href="index.html">الرئيسية</a></li>
      <li><a href="hotels.html">الفنادق</a></li>
      <li><a href="activities.html" class="active">الفعاليات</a></li>
      <li><a href="cars.html">المواصلات</a></li>
      <li><a href="calculator.html">حاسبة CF</a></li>
      <li><a href="contact.html">اتصل بنا</a></li>
    </ul>
  </div>
</nav>

<!-- 1. قسم موسكو -->
<section class="showroom-section">
  <div class="city-title">
    <span></span>
    <i class="fa-solid fa-building-columns"></i> فعاليات موسكو
    <span></span>
  </div>

  <div class="carousel-container">
    <button class="nav-btn nav-prev" onclick="moveMoscow(-1)"><i class="fa-solid fa-chevron-right"></i></button>
    <button class="nav-btn nav-next" onclick="moveMoscow(1)"><i class="fa-solid fa-chevron-left"></i></button>
    <div class="carousel-track" id="track-moscow"></div>
  </div>
</section>

<!-- 2. قسم سوتشي -->
<section class="showroom-section" style="padding-top: 0;">
  <div class="city-title">
    <span></span>
    <i class="fa-solid fa-water"></i> فعاليات سوتشي
    <span></span>
  </div>

  <div class="carousel-container">
    <button class="nav-btn nav-prev" onclick="moveSochi(-1)"><i class="fa-solid fa-chevron-right"></i></button>
    <button class="nav-btn nav-next" onclick="moveSochi(1)"><i class="fa-solid fa-chevron-left"></i></button>
    <div class="carousel-track" id="track-sochi"></div>
  </div>
</section>

<footer class="footer">
  <p>© 2025 CF Travel — جميع الحقوق محفوظة</p>
  <p style="direction: ltr; display: flex; align-items: center; gap: 5px;"><i class="fa-brands fa-whatsapp"></i> +7 985 199 6819</p>
</footer>

<div class="floating-social">
  <a href="https://wa.me/79851996819" class="social-btn btn-wa" target="_blank"><i class="fa-brands fa-whatsapp"></i></a>
  <a href="https://www.tiktok.com/@cf_travel_ru?_r=1" class="social-btn btn-tiktok" target="_blank"><i class="fa-brands fa-tiktok"></i></a>
  <a href="mailto:cftravel52@gmail.com" class="social-btn btn-email"><i class="fa-solid fa-envelope"></i></a>
</div>

<script>
const WHATSAPP_NUMBER = "79851996819"; 
const COMPANY_NAME = "CF Travel";

function bookActivity(activityName) {
  const msg = `مرحباً ${COMPANY_NAME}،\nأرغب في حجز فعالية: ${activityName}\nالتاريخ: \nعدد الأفراد: \nوشكراً.`;
  window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`, "_blank");
}

// فعاليات موسكو
const moscowActivities = [
  { name:"المنطاد", img:"images/balloon.jpg", desc:"تجربة رائعة للطيران فوق موسكو." },
  { name:"رحلة الهليكوبتر", img:"images/helicopter.jpg", desc:"رحلة جوية سريعة على متن هليكوبتر." },
  { name:"التجربة العسكرية", img:"images/tank.jpg", desc:"تجربة فريدة لركوب الدبابات." },
  { name:"دريفت السيارات", img:"images/drift.jpg", desc:"تجربة قيادة مثيرة مع مدرب." },
  { name:"ركوب الخيل", img:"images/horse.jpg", desc:"تجربة ركوب الخيل في الطبيعة." },
  { name:"جولة في الكرملين", img:"images/kremlin-tour.jpg", desc:"جولة سياحية بمرشد عربي." },
  { name:"السيرك الروسي", img:"images/circus.jpg", desc:"مشاهدة أشهر عروض السيرك." }
];

// فعاليات سوتشي
const sochiActivities = [
  { name:"تلفريك روزا خوتور", img:"images/sochi-cablecar.jpg", desc:"صعود الجبال والاستمتاع بإطلالات." },
  { name:"رحلة جبال كراسنايا بوليانا", img:"images/sochi-mountains.jpg", desc:"جولة يوم كامل في منتجعات الجبال." },
  { name:"سوتشي بارك", img:"images/sochi-park.jpg", desc:"أكبر مدينة ملاهي في روسيا." },
  { name:"رحلة بحرية", img:"images/sochi-yacht.jpg", desc:"رحلة بحرية على متن يخت خاص." },
  { name:"Skypark سوتشي", img:"images/sochi-skypark.jpg", desc:"أشهر وجهة للمغامرات في سوتشي." }
];

function createCard(act, index) {
  return `
    <div class="show-card" onclick="bookActivity('${act.name}')">
      <img src="${act.img}" alt="${act.name}" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1520106212299-d99c443e4568?w=800'">
      <div class="card-info">
        <h3>${act.name}</h3>
        <p>${act.desc}</p>
        <button class="btn-book-small" onclick="event.stopPropagation(); bookActivity('${act.name}')">
          <i class="fa-brands fa-whatsapp"></i> احجز الآن
        </button>
      </div>
    </div>
  `;
}

function updateWheel(activities, activeIndex, containerId) {
  const cards = document.querySelectorAll(`#${containerId} .show-card`);
  
  cards.forEach((card, index) => {
    let offset = index - activeIndex;
    if (Math.abs(offset) > 2) { 
      card.style.opacity = '0';
      card.style.pointerEvents = 'none';
      card.style.transform = `scale(0.5) translateX(${offset > 0 ? '100%' : '-100%'})`;
      return;
    }
    card.style.opacity = '1';
    card.style.pointerEvents = 'auto';
    let scale = 1 - Math.abs(offset) * 0.15;
    let translateX = offset * 65; 
    let rotateY = offset * -25; 
    let zIndex = 10 - Math.abs(offset);
    let opacity = 1 - Math.abs(offset) * 0.3; 
    
    if (offset === 0) {
      card.classList.add('active');
      card.style.transform = `translateX(0) scale(1) rotateY(0deg)`;
      card.style.opacity = '1';
    } else {
      card.classList.remove('active');
      card.style.transform = `translateX(${translateX}%) scale(${scale}) rotateY(${rotateY}deg)`;
      card.style.opacity = opacity;
    }
    card.style.zIndex = zIndex;
  });
}

// تشغيل موسكو
let moscowIndex = 0;
document.getElementById("track-moscow").innerHTML = moscowActivities.map((act, i) => createCard(act, i)).join("");
updateWheel(moscowActivities, moscowIndex, "track-moscow");

function moveMoscow(dir) {
  moscowIndex = (moscowIndex + dir + moscowActivities.length) % moscowActivities.length;
  updateWheel(moscowActivities, moscowIndex, "track-moscow");
}

// تشغيل سوتشي
let sochiIndex = 0;
document.getElementById("track-sochi").innerHTML = sochiActivities.map((act, i) => createCard(act, i)).join("");
updateWheel(sochiActivities, sochiIndex, "track-sochi");

function moveSochi(dir) {
  sochiIndex = (sochiIndex + dir + sochiActivities.length) % sochiActivities.length;
  updateWheel(sochiActivities, sochiIndex, "track-sochi");
}

document.querySelector(".menu-toggle").addEventListener("click", () => {
  document.querySelector(".nav-links").classList.toggle("open");
});
</script>
</body>
</html>
