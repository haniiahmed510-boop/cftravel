<head>

<title>الفعاليات | CF Travel</title>

*{margin:0;padding:0;box-sizing:border-box;}
:root{--primary:#0A2540;--secondary:#00B4D8;--accent:#FFB703;--text:#F8F9FA;--muted:#9CA3AF;}
html{scroll-behavior:smooth;}
body{font-family:'Cairo',sans-serif;color:var(--text);line-height:1.6;direction:rtl;overflow-x:hidden;background: linear-gradient(rgba(10, 37, 64, 0.85), rgba(10, 37, 64, 0.95)), url('https://images.unsplash.com/photo-1513326738677-b964603b136d?w=1600') center/cover fixed; background-attachment: fixed; background-size: cover; transition: all 0.3s ease;}
a{text-decoration:none;color:inherit;}
ul{list-style:none;}
.container{max-width:1300px;margin:0 auto;padding:0 20px;}

.top-bar{background:linear-gradient(90deg,var(--primary),var(--secondary));color:#fff;text-align:center;padding:10px 20px;font-size:14px;font-weight:600;position:fixed;top:0;width:100%;z-index:1000;}
.navbar{background:rgba(10, 37, 64, 0.9);backdrop-filter:blur(15px);border-bottom:1px solid rgba(255,255,255,0.1);position:fixed;top:41px;width:100%;z-index:1000;}
.nav-inner{display:flex;align-items:center;justify-content:space-between;padding:15px 0;}
.logo{font-size:26px;font-weight:800;color:#fff;display:flex;align-items:center;gap:10px;}
.nav-logo-img{height:50px;width:auto;border-radius:8px;object-fit:contain;}
.nav-logo-text{display:flex;align-items:center;gap:5px;letter-spacing:0.5px;}
.nav-logo-text span{color:var(--accent);}
.nav-links{display:flex;gap:24px;align-items:center;}
.nav-links a{font-weight:600;color:#fff;transition:.3s;position:relative;font-size:16px;}
.nav-links a:hover,.nav-links a.active{color:var(--secondary);}
.nav-links a.active::after{content:'';position:absolute;bottom:-6px;right:0;left:0;height:3px;background:var(--accent);border-radius:2px;}
.menu-toggle{display:none;font-size:22px;background:none;border:none;color:#fff;cursor:pointer;}

.lang-switcher { display: flex; gap: 10px; margin-left: 20px; }
.lang-switcher button {
  background: transparent; border: 1px solid var(--secondary);
  color: var(--secondary); padding: 5px 10px; border-radius: 5px;
  cursor: pointer; font-family: 'Cairo', sans-serif; font-weight: bold; font-size: 14px; transition: 0.3s;
}
.lang-switcher button:hover { background: var(--secondary); color: #000; }

.showroom-section { position: relative; width: 100%; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding-top: 100px; padding-bottom: 50px; overflow: hidden; }
.city-title { font-size: 32px; font-weight: 800; color: var(--accent); margin: 40px 0 20px; text-align: center; display: flex; align-items: center; justify-content: center; gap: 15px; text-shadow: 0 0 20px rgba(255, 183, 3, 0.5); }
.city-title span { height: 2px; width: 80px; background: linear-gradient(90deg, transparent, var(--accent), transparent); }
.notice-text { text-align: center; color: #ff4757; font-weight: 800; margin-bottom: 20px; font-size: 16px; }
.carousel-container { position: relative; width: 100%; height: 550px; display: flex; justify-content: center; align-items: center; perspective: 1200px; }
.carousel-track { position: relative; width: 340px; height: 480px; transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1); }
.show-card { position: absolute; top: 0; left: 0; width: 340px; height: 480px; border-radius: 20px; overflow: hidden; background: #000; border: 2px solid rgba(255,255,255,0.1); box-shadow: 0 15px 35px rgba(0,0,0,0.5); transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1); transform-origin: center center; cursor: pointer; }
.show-card img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s; }
.show-card::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, rgba(10,37,64,0.98) 0%, rgba(10,37,64,0.4) 60%, transparent 100%); transition: background 0.4s; }
.card-info { position: absolute; bottom: 0; left: 0; right: 0; padding: 25px 20px; z-index: 2; text-align: center; transform: translateY(20px); opacity: 0; transition: all 0.5s; }
.card-info h3 { font-size: 22px; font-weight: 800; color: var(--accent); margin-bottom: 8px; text-shadow: 0 2px 10px rgba(0,0,0,0.8);}
.card-info p { font-size: 14px; color: #ddd; line-height: 1.6; margin-bottom: 15px;}
.btn-book-small { background: var(--secondary); color: #000; border: none; padding: 10px 20px; border-radius: 50px; font-size: 14px; font-weight: 800; font-family: inherit; cursor: pointer; transition: 0.3s; display: inline-flex; align-items: center; gap: 6px; }
.btn-book-small:hover { background: #fff; }
.show-card.active { border-color: var(--secondary); box-shadow: 0 0 50px rgba(0, 180, 216, 0.5); z-index: 50; }
.show-card.active img { transform: scale(1.05); }
.show-card.active .card-info { transform: translateY(0); opacity: 1; }
.nav-btn { position: absolute; top: 50%; transform: translateY(-50%); width: 60px; height: 60px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; z-index: 100; transition: 0.3s; }
.nav-btn:hover { background: var(--secondary); color: #000; transform: translateY(-50%) scale(1.1); }
.nav-prev { right: 10%; }
.nav-next { left: 10%; }
.footer{position:relative; width:100%; background:rgba(5,12,21,0.95); border-top:1px solid rgba(255, 255, 255, 0.1); color:#fff;padding:20px 0;text-align:center; display:flex; justify-content:center; align-items:center; gap:20px;}
.footer p{opacity:.8;font-size:13px; margin:0;}
