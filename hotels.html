<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--primary:#0A2540;--secondary:#00B4D8;--accent:#FFB703;--text:#F8F9FA;--muted:#9CA3AF;}
html{scroll-behavior:smooth;}
body{font-family:'Cairo',sans-serif;color:var(--text);background:var(--primary);line-height:1.6;direction:rtl;overflow-x:hidden;}
a{text-decoration:none;color:inherit;}
ul{list-style:none;}
.container{max-width:1300px;margin:0 auto;padding:0 20px;}
.top-bar{background:linear-gradient(90deg,var(--primary),var(--secondary));color:#fff;text-align:center;padding:10px 20px;font-size:14px;font-weight:600;position:fixed;top:0;width:100%;z-index:1000;}
.navbar{background:rgba(10, 37, 64, 0.9);backdrop-filter:blur(15px);border-bottom:1px solid rgba(255,255,255,0.1);position:fixed;top:41px;width:100%;z-index:1000;}
.nav-inner{display:flex;align-items:center;justify-content:space-between;padding:15px 0;}
.logo{font-size:26px;font-weight:800;color:#fff;display:flex;align-items:center;gap:10px;}
.nav-logo-img{height:50px;width:auto;border-radius:8px;object-fit:contain;}

.nav-links{display:flex;gap:24px;align-items:center;}

.nav-links a:hover,.nav-links a.active{color:var(--secondary);}
.nav-links a.active::after{content:'';position:absolute;bottom:-6px;right:0;left:0;height:3px;background:var(--accent);border-radius:2px;}
.menu-toggle{display:none;font-size:22px;background:none;border:none;color:#fff;cursor:pointer;}
.showroom-section { position: relative; width: 100%; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; perspective: 1500px; padding-top: 100px; background: linear-gradient(rgba(10, 37, 64, 0.85), rgba(10, 37, 64, 0.95)), url('https://images.unsplash.com/photo-1513326738677-b964603b136d?w=1600') center/cover fixed; overflow: hidden; }
.section-title { text-align: center; margin-bottom: 20px; z-index: 10; }
.section-title h1 { font-size: clamp(24px,3vw,36px); font-weight: 800; color: #fff; }

.show-card img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.8s; pointer-events: none; -webkit-user-drag: none; }
.show-card::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, rgba(10,37,64,0.98) 0%, rgba(10,37,64,0.2) 60%, transparent 100%); transition: background 0.4s; }
.show-content { position: absolute; bottom: 0; left: 0; right: 0; padding: 30px 20px; z-index: 2; text-align: center; transform: translateY(20px); opacity: 0; transition: all 0.5s; }
.show-zone { display: inline-flex; align-items: center; gap: 6px; background: var(--secondary); color: #000; padding: 4px 12px; border-radius: 50px; font-size: 12px; font-weight: 800; margin-bottom: 8px; }
.show-content h3 { font-size: 24px; font-weight: 800; color: var(--secondary); margin-bottom: 5px; }
.show-stars { color: var(--accent); font-size: 14px; letter-spacing: 2px; margin-bottom: 15px; }
.card-actions { display: flex; gap: 10px; justify-content: center; }
.btn-gallery { padding: 10px 20px; border-radius: 50px; font-size: 14px; font-weight: 700; font-family: inherit; cursor: pointer; transition: 0.3s; border: 1px solid var(--secondary); background: transparent; color: var(--secondary); }
.btn-gallery:hover { background: var(--secondary); color: #000; }
.btn-book { padding: 10px 20px; border-radius: 50px; font-size: 14px; font-weight: 700; font-family: inherit; cursor: pointer; transition: 0.3s; border: 1px solid var(--secondary); background: var(--secondary); color: #000; }
.btn-book:hover { background: #fff; box-shadow: 0 0 15px rgba(0, 180, 216, 0.5); }
.show-card.active { box-shadow: 0 0 80px rgba(0, 180, 216, 0.4); border-color: var(--secondary); }
.show-card.active .show-content { transform: translateY(0); opacity: 1; }
.show-card.active img { transform: scale(1.05); }
.nav-btn { position: absolute; top: 50%; transform: translateY(-50%); width: 60px; height: 60px; background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; z-index: 100; transition: 0.3s; }
.nav-btn:hover { background: var(--secondary); color: #000; transform: translateY(-50%) scale(1.1); }
.nav-prev { right: 5%; }
.nav-next { left: 5%; }
.modal-overlay { position: fixed; inset: 0; background: rgba(10, 37, 64, 0.98); backdrop-filter: blur(15px); z-index: 9999; display: none; align-items: center; justify-content: center; perspective: 1500px; opacity: 0; transition: opacity 0.4s ease; }
.modal-overlay.active { display: flex; opacity: 1; }
.modal-content { position: relative; width: 95%; max-width: 1300px; display: flex; flex-direction: row; align-items: center; justify-content: space-between; gap: 40px; }

.close-modal:hover { background: #ff4757; border-color: #ff4757; color: #fff; transform: rotate(90deg); }
.gallery-3d { position: relative; width: 100%; height: 450px; display: flex; align-items: center; justify-content: center; transform-style: preserve-3d; }
.gallery-card { position: absolute; width: 500px; height: 350px; border-radius: 20px; overflow: hidden; box-shadow: 0 25px 60px rgba(0,0,0,0.8); transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1); transform-origin: center center; cursor: pointer; border: 2px solid rgba(255,255,255,0.1); }
.gallery-card img { width: 100%; height: 100%; object-fit: cover; }
.modal-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 50px; height: 50px; background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border: 1px solid var(--secondary); color: var(--secondary); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; z-index: 100; transition: 0.3s; }

.hotel-details-box { flex: 1; background: rgba(10, 37, 64, 0.8); border: 1px solid rgba(0, 180, 216, 0.2); padding: 40px; border-radius: 24px; backdrop-filter: blur(10px); }

@media(max-width:1000px){

  .nav-prev { right: 1%; }

  .gallery-card { width: 280px; height: 200px; }
  .modal-nav { width: 40px; height: 40px; font-size: 16px; }
  .nav-gallery-prev { right: 0; }

  .footer { flex-direction: column; gap: 5px; }
  .floating-social { bottom: 100px; }
  .menu-toggle{display:block;}
  .nav-links{ position:absolute; top:100%; right:0; left:0; background:rgba(10,37,64,0.98); backdrop-filter:blur(15px); flex-direction:column; gap:0; max-height:0; overflow:hidden; transition:max-height 0.4s ease; }
  .nav-links.show{max-height:500px;}
  .nav-links li{width:100%;}
  .nav-links a{ display:block; padding:15px 20px; border-bottom:1px solid rgba(255,255,255,0.08); }
  .nav-links a.active::after{display:none;}
}
</style>
</head>

<script>
const WHATSAPP_NUMBER = "79851996819";
const COMPANY_NAME = "CF Travel";
let currentBookingHotel = "";
const hotels = [
  { name:"Ararat Park Hyatt", stars:5, zone:"السنتر", cover:"images/ararat-cover.jpg", images:["images/ararat-room1.jpg","images/ararat-room2.jpg","images/ararat-room3.jpg"], info: { distance:"5 دقائق مشي", view:"مسرح البولشوي", size:"من 40 إلى 75 متر" } },
  { name:"Baltschug Kempinski", stars:5, zone:"على النهر", cover:"images/baltschug-cover.jpg", images:["images/baltschug-room1.jpg","images/baltschug-room2.jpg","images/baltschug-room3.jpg"], info: { distance:"15 دقيقة مشي", view:"الكرملين والنهر", size:"من 35 إلى 65 متر" } },
  { name:"The Carlton, Moscow", stars:5, zone:"السنتر", cover:"images/carlton-cover.jpg", images:["images/carlton-room1.jpg","images/carlton-room2.jpg","images/carlton-room3.jpg"], info: { distance:"3 دقائق مشي", view:"شارع Tverskaya", size:"من 40 إلى 70 متر" } },
  { name:"Cosmos Arbat", stars:4, zone:"أربات", cover:"images/Cosmos arbat.jpg", images:["images/cosmos-room1.jpg","images/cosmos-room2.jpg","images/cosmos-room3.jpg"], info: { distance:"10 دقائق مشي", view:"شارع أربات", size:"من 25 إلى 45 متر" } },
  { name:"DoubleTree Arbat", stars:4, zone:"أربات", cover:"images/doubletree-arbat-cover.jpg", images:["images/doubletree-arbat-room1.jpg","images/doubletree-arbat-room2.jpg","images/doubletree-arbat-room3.jpg"], info: { distance:"8 دقائق مشي", view:"شارع أربات", size:"من 25 إلى 45 متر" } },
  { name:"Four Seasons Hotel Moscow", stars:5, zone:"السنتر", cover:"images/four-seasons-cover.jpg", images:["images/four-seasons-room1.jpg","images/four-seasons-room3.jpg","images/four-seasons-room4.jpg"], info: { distance:"دقيقة واحدة مشي", view:"الكرملين مباشرة", size:"من 45 إلى 80 متر" } },
  { name:"Intermark Hotel", stars:4, zone:"السنتر", cover:"images/intermark-cover.jpg", images:["images/intermark-room1.jpg","images/intermark-room2.jpg"], info: { distance:"5 دقائق مشي", view:"وسط موسكو", size:"من 25 إلى 45 متر" } },
  { name:"Lotte Hotel Moscow", stars:5, zone:"أربات", cover:"images/lotte-cover.jpg", images:["images/lotte-room1.jpg","images/lotte-room3.jpg","images/lotte-room4.jpg"], info: { distance:"10 دقائق مشي", view:"شارع أربات", size:"من 40 إلى 75 متر" } },
  { name:"Metropol Hotel", stars:5, zone:"السنتر", cover:"images/metropol-cover.jpg", images:["images/metropol-room1.jpg","images/metropol-room2.jpg","images/metropol-room3.jpg"], info: { distance:"2 دقيقة مشي", view:"مسرح البولشوي", size:"من 35 إلى 65 متر" } },
  { name:"National Hotel", stars:5, zone:"السنتر", cover:"images/national-cover.jpg", images:["images/national-cover.jpg", "images/national-room1.jpg", "images/national-room2.jpg", "images/national-room3.jpg"], info: { distance:"2 دقيقة مشي", view:"الكرملين", size:"من 35 إلى 60 متر" } },
  { name:"Novotel Moscow City", stars:4, zone:"على النهر", cover:"images/novotel-cover.jpg", images:["images/novotel-room1.jpg","images/novotel-room2.jpg","images/novotel-room3.jpg"], info: { distance:"15 دقيقة بالسيارة", view:"نهر موسكو", size:"من 25 إلى 40 متر" } },
  { name:"Radisson Collection", stars:5, zone:"على النهر", cover:"images/radisson-collection-cover.jpg", images:["images/radisson-collection-room1.jpg","images/radisson-collection-room2.jpg"], info: { distance:"10 دقائق مشي", view:"إطلالة على النهر", size:"من 40 إلى 70 متر" } },
  { name:"St. Regis Moscow", stars:5, zone:"السنتر", cover:"images/st-regis-cover.jpg", images:["images/st-regis-room1.jpg","images/st-regis-room2.jpg","images/st-regis-room3.jpg"], info: { distance:"5 دقائق مشي", view:"قرب الكرملين", size:"من 45 إلى 80 متر" } },
  { name:"Swissôtel Krasnye Holmy", stars:5, zone:"على النهر", cover:"images/swissotel-cover.jpg", images:["images/swissotel-room1.jpg","images/swissotel-room2.jpg","images/swissotel-room3.jpg"], info: { distance:"10 دقائق مشي", view:"إطلالة بانورامية", size:"من 35 إلى 60 متر" } }
];
const track = document.getElementById("carouselTrack");
const container = document.getElementById("carouselContainer");
let activeIndex = 0;
function renderCarousel() {
  track.innerHTML = hotels.map((hotel, index) => {
    const stars = "★".repeat(hotel.stars) + "☆".repeat(5 - hotel.stars);
    return `
      <div class="show-card">
        <img src="${hotel.cover}" alt="${hotel.name}" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1566073771259-6a8506099945?w=600'">
        <div class="show-content">
          <span class="show-zone">${hotel.zone}</span>
          <h3>${hotel.name}</h3>
          <div class="show-stars">${stars}</div>
          <div class="card-actions">
            <button class="btn-gallery" onclick="openGallery(${index})">شاهد الغرف</button>
            <button class="btn-book" onclick="bookHotel('${hotel.name}')">احجز الآن</button>
          </div>
        </div>
      </div>
    `;
  }).join("");
  updateCarousel();
}
function updateCarousel() {
  const cards = document.querySelectorAll(".show-card");
  cards.forEach((card, index) => {
    let offset = index - activeIndex;
    if (Math.abs(offset) > 2) {
      card.style.opacity = '0'; card.style.pointerEvents = 'none';
      card.style.transform = `scale(0.5) translateX(${offset > 0 ? '100%' : '-100%'})`;
      return;
    }
    card.style.opacity = '1'; card.style.pointerEvents = 'auto';
    let scale = 1 - Math.abs(offset) * 0.15;
    let translateX = offset * 65;
    let rotateY = offset * -25;
    let zIndex = 10 - Math.abs(offset);
    let opacity = 1 - Math.abs(offset) * 0.3;
    if (offset === 0) {
      card.classList.add('active');
      card.style.transform = `translateX(0) scale(1) rotateY(0deg)`;
      card.style.opacity = '1';
    } else {
      card.classList.remove('active');
      card.style.transform = `translateX(${translateX}%) scale(${scale}) rotateY(${rotateY}deg)`;
      card.style.opacity = opacity;
    }
    card.style.zIndex = zIndex;
  });
}
function moveCarousel(direction) {
  activeIndex += direction;
  if (activeIndex < 0) activeIndex = hotels.length - 1;
  if (activeIndex >= hotels.length) activeIndex = 0;
  updateCarousel();
}
let startX = 0, isDragging = false;
const swipeThreshold = 50;
function dragStart(e) {
  if (e.target.closest('button')) return;
  isDragging = true;
  startX = e.type.includes('mouse') ? e.pageX : e.touches[0].pageX;
  track.style.transition = 'none'; 
}
function dragEnd(e) {
  if (!isDragging) return;
  isDragging = false;
  track.style.transition = 'transform 0.8s cubic-bezier(0.25, 1, 0.5, 1)';
  let endX = e.type.includes('mouse') ? e.pageX : e.changedTouches[0].pageX;
  let diff = startX - endX;
  if (diff > swipeThreshold) moveCarousel(1);
  else if (diff < -swipeThreshold) moveCarousel(-1);
  else updateCarousel();
}
container.addEventListener('mousedown', dragStart);
container.addEventListener('mouseup', dragEnd);
container.addEventListener('mouseleave', () => { if(isDragging) dragEnd({ type: 'mouse', pageX: startX }); });
container.addEventListener('touchstart', dragStart, {passive: true});
container.addEventListener('touchend', dragEnd, {passive: true});
container.addEventListener('dragstart', (e) => e.preventDefault());
const modal = document.getElementById("galleryModal");
const gallery3D = document.getElementById("gallery3D");
let currentHotelImages = [], currentGalleryIndex = 0, galleryCards = [];
function openGallery(hotelIndex) {
  const hotel = hotels[hotelIndex];
  document.getElementById("modalHotelName").innerText = hotel.name;
  currentBookingHotel = hotel.name;
  currentHotelImages = hotel.images;
  currentGalleryIndex = 0;
  gallery3D.querySelectorAll('.gallery-card').forEach(el => el.remove());
  currentHotelImages.forEach((img, i) => {
    let card = document.createElement("div");
    card.className = "gallery-card";
    card.innerHTML = `<img src="${img}" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1611892440504-42a792e24d32?w=800'">`;
    card.onclick = () => { currentGalleryIndex = i; updateGallery3D(); };
    gallery3D.appendChild(card);
  });
  galleryCards = document.querySelectorAll(".gallery-card");
  updateGallery3D();
  modal.classList.add("active");
}
function closeGallery() { modal.classList.remove("active"); }
function updateGallery3D() {
  galleryCards.forEach((card, index) => {
    let offset = index - currentGalleryIndex;
    if (Math.abs(offset) > 2) {
      card.style.opacity = '0'; card.style.pointerEvents = 'none';
      card.style.transform = `scale(0.5) translateX(${offset > 0 ? '60%' : '-60%'})`;
      return;
    }
    card.style.opacity = '1'; card.style.pointerEvents = 'auto';
    let scale = 1 - Math.abs(offset) * 0.2;
    let translateX = offset * 40;
    let rotateY = offset * -30;
    let zIndex = 10 - Math.abs(offset);
    let opacity = 1 - Math.abs(offset) * 0.4;
    if (offset === 0) {
      card.style.transform = `translateX(0) scale(1) rotateY(0deg)`;
      card.style.opacity = '1'; card.style.zIndex = 10;
      card.style.borderColor = 'var(--secondary)';
      card.style.boxShadow = '0 0 60px rgba(0, 180, 216, 0.5)';
    } else {
      card.style.transform = `translateX(${translateX}%) scale(${scale}) rotateY(${rotateY}deg)`;
      card.style.opacity = opacity; card.style.zIndex = zIndex;
      card.style.borderColor = 'rgba(255,255,255,0.1)';
      card.style.boxShadow = '0 25px 60px rgba(0,0,0,0.8)';
    }
  });
}
function moveGallery(direction) {
  if (!currentHotelImages.length) return;
  currentGalleryIndex += direction;
  if (currentGalleryIndex < 0) currentGalleryIndex = currentHotelImages.length - 1;
  if (currentGalleryIndex >= currentHotelImages.length) currentGalleryIndex = 0;
  updateGallery3D();
}
function bookHotel(hotelName) {
  if (!hotelName) hotelName = currentBookingHotel;
  if (!hotelName) return;
  const message = `مرحباً ${COMPANY_NAME} 👋\nأرغب في حجز فندق: *${hotelName}*\nمن فضلك أرسل لي التفاصيل والأسعار.`;
  const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
  window.open(url, '_blank');
}
modal.addEventListener('click', (e) => { if (e.target === modal) closeGallery(); });
document.addEventListener('keydown', (e) => {
  if (!modal.classList.contains('active')) return;
  if (e.key === 'Escape') closeGallery();
  if (e.key === 'ArrowRight') moveGallery(-1);
  if (e.key === 'ArrowLeft') moveGallery(1);
});
const menuToggle = document.querySelector('.menu-toggle');
const navLinks = document.querySelector('.nav-links');
if (menuToggle) {
  menuToggle.addEventListener('click', () => {
    navLinks.classList.toggle('show');
    const icon = menuToggle.querySelector('i');
    if (navLinks.classList.contains('show')) { icon.classList.remove('fa-bars'); icon.classList.add('fa-xmark'); } 
    else { icon.classList.remove('fa-xmark'); icon.classList.add('fa-bars'); }
  });
  navLinks.querySelectorAll('a').forEach(link => {
    link.addEventListener('click', () => {
      navLinks.classList.remove('show');
      const icon = menuToggle.querySelector('i');
      icon.classList.remove('fa-xmark'); icon.classList.add('fa-bars');
    });
  });
}
renderCarousel();
</script>
